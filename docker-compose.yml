services:
  postgres:
    image: postgres:16-alpine
    container_name: confeitaria-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: confeitaria
      POSTGRES_PASSWORD: confeitaria
      POSTGRES_DB: confeitaria
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
